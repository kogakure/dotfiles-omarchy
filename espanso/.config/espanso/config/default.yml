# espanso settings shared by every OS. Per-OS overrides live next to this file
# (macos.yml). Reference: https://espanso.org/docs/configuration/options/

# Snippets without a memorable trigger are meant to be found here: the search
# bar matches on each snippet's label (its old Raycast name).
search_shortcut: ALT+SPACE

# Wayland does not detect the layout, and a wrong map misreads triggers.
# This laptop's Hyprland keymap is English (US) with an empty variant
# (hyprctl devices, localectl). Colemak-DH is the Mac layout, not this one:
# setting variant colemak_dh here would remap the keys the session emits.
# If the keymap changes, update this block to match it.
keyboard_layout:
  rules: evdev
  model: pc105
  layout: us
